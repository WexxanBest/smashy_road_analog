<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUSTLINE · проверка эффектов</title><style>
*{box-sizing:border-box}body{margin:0;background:#17231e;color:#eee9d7;font:14px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}.panel{position:fixed;left:20px;top:20px;width:min(440px,calc(100vw - 40px));padding:18px;background:#13231eea;border:1px solid #71826c;border-radius:12px}.panel h1{font-size:18px;margin:0 0 8px}.panel p{line-height:1.5;color:#bdc8b6;margin:8px 0}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button{background:#34473d;color:#f3eedb;border:1px solid #7d8c74;border-radius:6px;padding:8px 10px;cursor:pointer}button[aria-pressed=true]{background:#e7eb73;color:#16271e}input{width:100%;accent-color:#e7eb73}output{font-variant-numeric:tabular-nums}#status{font-size:12px;color:#d2dcbf}.hint{position:fixed;bottom:18px;left:20px;background:#17231ecf;padding:8px 12px;border-radius:6px;color:#c9d3c4}
</style></head><body><canvas id="canvas"></canvas><section class="panel"><h1>Взрывы и вертолёты · игровые модели</h1><p>Те же модели и эффекты, что в игре. Осколки здесь движутся по заданной траектории для повторяемого просмотра кадров.</p><div class="row" id="modes"><button data-mode="car" aria-pressed="true">Машина</button><button data-mode="helicopter" aria-pressed="false">Вертолёт</button><button data-mode="observer" aria-pressed="false">Наблюдатель</button><button data-mode="transport" aria-pressed="false">Транспортный</button></div><div class="row" id="frames"><button data-time="0.05">01 · Вспышка</button><button data-time="0.25">02 · Удар</button><button data-time="1.3">03 · Остов</button><button id="play">▶ Повторить</button></div><p><label for="time">Время: <output id="time-label">0,25 с</output></label></p><input id="time" type="range" min="0" max="4" step="0.01" value="0.25"><p id="status"></p></section><div class="hint">Мышь — поворот камеры · Колесо — масштаб</div><script type="module" src="./effects-viewer.ts"></script></body></html>
